name: CI - Build, Test & Quality

on:
  push:
    branches: [main]        # ← déclenchement automatique sur push
  pull_request:
    branches: [main]        # ← déclenchement sur PR vers main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v3

      - name: 🔍 Vérifier la présence des fichiers essentiels
        run: |
          echo "Vérification des fichiers..."
          test -f Dockerfile && echo "✅ Dockerfile présent" || exit 1
          test -f nginx/nginx.conf && echo "✅ nginx.conf présent" || exit 1
          test -f html/index.html && echo "✅ index.html présent" || exit 1

      - name: 🔒 Vérifier l'absence de secrets dans le code
        run: |
          echo "Scan des secrets..."
          # Vérifie qu'aucun mot de passe ou clé n'est commité
          ! grep -r "password=" . --include="*.conf" --include="*.env" && echo "✅ Aucun secret détecté"

      - name: 🐳 Build de l'image Docker
        run: docker build -t nginx-ci-demo .

      - name: ✅ Tester la configuration Nginx
        run: docker run --rm nginx-ci-demo nginx -t

      - name: 🚀 Lancer le conteneur
        run: docker run -d --name nginx-test -p 8080:80 nginx-ci-demo

      - name: ⏳ Attendre que Nginx démarre
        run: sleep 3

      - name: 🌐 Tester la réponse HTTP
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080)
          echo "Status HTTP: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ HTTP 200 OK" || exit 1

      - name: 🏥 Tester l'endpoint /health
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080/health)
          echo "Status /health: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ /health répond 200" || exit 1

      - name: 🧹 Nettoyage
        if: always()   # ← s'exécute même si un step échoue
        run: |
          docker stop nginx-test 2>/dev/null || true
          docker rm nginx-test 2>/dev/null || true
