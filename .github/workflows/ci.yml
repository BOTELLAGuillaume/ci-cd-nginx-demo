name: CI - Build & Test Nginx

on:
  workflow_dispatch:  # Déclenchement manuel pour le niveau 1

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🔍 Vérifier la présence des fichiers essentiels
        run: |
          echo "Vérification des fichiers..."
          test -f Dockerfile && echo "✅ Dockerfile présent" || exit 1
          test -f nginx/nginx.conf && echo "✅ nginx.conf présent" || exit 1
          test -f html/index.html && echo "✅ index.html présent" || exit 1

      - name: 🐳 Build de l'image Docker
        run: docker build -t nginx-ci-demo .

      - name: ✅ Tester la configuration Nginx
        run: docker run --rm nginx-ci-demo nginx -t

      - name: 🚀 Lancer le conteneur
        run: docker run -d --name nginx-test -p 8080:80 nginx-ci-demo

      - name: ⏳ Attendre que Nginx démarre
        run: sleep 3

      - name: 🌐 Vérifier que Nginx répond
        run: curl -f http://localhost:8080 && echo "✅ Nginx répond correctement"

      - name: 🧹 Nettoyage
        run: docker stop nginx-test && docker rm nginx-test
